[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locaish"
version = "0.1.0"
description = "Scan any room, get a filming-ready metric digital twin."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "pillow>=10.0",
    "scikit-image>=0.22",
    # The agent: Gemini on Google Cloud's Agent Development Kit, with the
    # official ClickHouse MCP server as its tool surface and clickhouse-connect
    # for bulk-loading the shot sweep it searches.
    "google-adk>=2.7,<2.8",
    "mcp-clickhouse>=0.4,<0.5",
    "mcp>=1.10,<2",
    "clickhouse-connect>=1.7",
    # The Meta Model API (Muse Spark, Muse Wonder, Muse Image, SAM 3.1) over
    # plain HTTP: locaish/meta/client.py. No SDK; the wire format is OpenAI's.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The video front-end: COLMAP structure-from-motion (ALIKED features and
# GLOMAP where the build has them) plus multi-view stereo. OpenCV supplies
# the CPU stereo fallback; the `colmap` and `ffmpeg` binaries must be on PATH,
# which pip cannot supply (`brew install colmap ffmpeg` / `apt install colmap
# ffmpeg`). COLMAP 4.x with ONNX support is what unlocks ALIKED.
video = [
    "opencv-python-headless>=4.9",
]
# The learned geometry stage (locaish/video/learned.py): MoGe-2, a metric
# monocular geometry model (MIT licence, weights fetched from Hugging Face on
# first use), which anchors the twin's scale and fills the walls stereo
# cannot match. Pinned to the last MoGe-2 commit: the repository's main
# branch is MoGe-3, which needs Triton and has no macOS build.
learned = [
    "torch>=2.2",
    "torchvision",
    "huggingface_hub",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
    "moge @ git+https://github.com/microsoft/MoGe.git@0744441",
]

# The open-weight SAM 3D models (Objects and Body) need a CUDA GPU and run on
# Modal: locaish/meta/sam3d.py calls the deployed app over HTTP, so this extra
# is only for the machine that deploys it.
sam3d = [
    "modal>=1.0",
]

[project.scripts]
locaish = "locaish.cli:main"

[tool.setuptools.packages.find]
include = ["locaish*"]

[tool.setuptools.package-data]
locaish = ["viewer/*.html", "viewer/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
