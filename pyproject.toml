[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locaish"
version = "0.1.0"
description = "Scan any room, get a filming-ready metric digital twin."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "pillow>=10.0",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Reconstructing a video into a cloud. Kept optional because it is a multi-
# gigabyte install for a capability most scan-file users never touch, and every
# import of it in `locaish.video` is function-local so the rest of the CLI works
# without it. Needs `ffmpeg` on PATH as well, which pip cannot supply.
video = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "vggt @ git+https://github.com/facebookresearch/vggt.git",
]

[project.scripts]
locaish = "locaish.cli:main"

[tool.setuptools.packages.find]
include = ["locaish*"]

[tool.setuptools.package-data]
locaish = ["viewer/*.html", "viewer/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
