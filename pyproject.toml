[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locaish"
version = "0.1.0"
description = "Scan any room, get a filming-ready metric digital twin."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "pillow>=10.0",
    "scikit-image>=0.22",
    # The agent: Gemini on Google Cloud's Agent Development Kit, with the
    # official ClickHouse MCP server as its tool surface and clickhouse-connect
    # for bulk-loading the shot sweep it searches.
    "google-adk>=2.7,<2.8",
    "mcp-clickhouse>=0.4",
    "clickhouse-connect>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The video front-end reconstructs classically -- COLMAP structure-from-motion
# plus stereo matching, no neural networks anywhere (see locaish/video/colmap.py
# for why that is load-bearing). OpenCV supplies the CPU stereo fallback; the
# `colmap` and `ffmpeg` binaries must be on PATH, which pip cannot supply
# (`brew install colmap ffmpeg` / `apt install colmap ffmpeg`).
video = [
    "opencv-python-headless>=4.9",
]

[project.scripts]
locaish = "locaish.cli:main"

[tool.setuptools.packages.find]
include = ["locaish*"]

[tool.setuptools.package-data]
locaish = ["viewer/*.html", "viewer/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
